name: Validate virtual MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run examples
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-${{ matrix.os }}
          path: build/site/
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify-repository.py
      - run: python firmware/test/run_host_tests.py --compiler g++
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware -e esp32dev
