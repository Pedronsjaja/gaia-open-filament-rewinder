<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>11 · Comparação de arquitetura</title><desc>Both versions transfer existing filament. Costs UNKNOWN until all included materials have valid quotations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">11 · Comparação de arquitetura</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><rect x="60" y="155" width="500" height="415" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="75" y="186" font-size="20" fill="#20334b">LITE</text><text x="75" y="215" font-size="16" fill="#20334b">Transferência econômica, operação manual</text><rect x="635" y="155" width="500" height="415" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="650" y="186" font-size="20" fill="#20334b">SMART</text><text x="650" y="215" font-size="16" fill="#20334b">Medição e guia automatizado propostos</text><text x="85" y="285" font-size="21" fill="#20334b">Motorredutor DC + PWM independente</text><text x="85" y="333" font-size="21" fill="#20334b">Start / Stop e parada física</text><text x="85" y="381" font-size="21" fill="#20334b">Tensor passivo + guia manual</text><text x="85" y="429" font-size="21" fill="#20334b">Balança externa opcional</text><text x="85" y="477" font-size="21" fill="#20334b">Sem MCU e sem medição linear digital</text><text x="660" y="285" font-size="21" fill="#20334b">Motorredutor + ESP32 proposto</text><text x="660" y="333" font-size="21" fill="#20334b">Roda e encoder lineares independentes</text><text x="660" y="381" font-size="21" fill="#20334b">Guia de passo + dois limites NC</text><text x="660" y="429" font-size="21" fill="#20334b">Falhas, watchdog e rearme local</text><text x="660" y="477" font-size="21" fill="#20334b">Mesmo dever de proteção física</text><text x="40" y="652" font-size="17" fill="#20334b">Both versions transfer existing filament. Costs UNKNOWN until all included materials have valid quotations.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>