<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>06 · Motorredutor e transmissão proposta</title><desc>This is an integration proposal. No loaded speed, torque margin or thermal performance has been measured.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">06 · Motorredutor e transmissão proposta</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><rect x="65" y="250" width="240" height="120" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="80" y="281" font-size="20" fill="#20334b">Motor DC 12 V</text><text x="80" y="310" font-size="16" fill="#20334b">100 rpm SEM CARGA</text><rect x="400" y="250" width="250" height="120" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="415" y="281" font-size="20" fill="#20334b">Acoplamento flexível</text><text x="415" y="310" font-size="16" fill="#20334b">Motor Ø6 / eixo Ø8 mm</text><rect x="750" y="250" width="330" height="120" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="765" y="281" font-size="20" fill="#20334b">Eixo com dois mancais</text><text x="765" y="310" font-size="16" fill="#20334b">Cubo anti-rotação a detalhar</text><path d="M305,310 L400,310" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M650,310 L750,310" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="445" font-size="22" fill="#20334b">Candidato Pololu 4755: stall extrapolado 5,5 A; carga real NOT_MEASURED.</text><text x="80" y="495" font-size="22" fill="#20334b">Dimensionar corrente, limite de torque e proteções antes de energizar.</text><text x="80" y="545" font-size="22" fill="#20334b">Alternativa: correia + polias dimensionadas; razão não selecionada.</text><text x="40" y="652" font-size="17" fill="#20334b">This is an integration proposal. No loaded speed, torque margin or thermal performance has been measured.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>