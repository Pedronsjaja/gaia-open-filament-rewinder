<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>04 · Caminho do filamento</title><desc>No extrusion, heater or molten polymer. Transfer existing filament only.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">04 · Caminho do filamento</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><rect x="50" y="250" width="180" height="100" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="65" y="281" font-size="20" fill="#20334b">Origem</text><text x="65" y="310" font-size="16" fill="#20334b">Giro livre</text><rect x="285" y="250" width="180" height="100" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="300" y="281" font-size="20" fill="#20334b">Tensor passivo</text><text x="300" y="310" font-size="16" fill="#20334b">Força não medida</text><rect x="520" y="250" width="180" height="100" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="535" y="281" font-size="20" fill="#20334b">Roda linear</text><text x="535" y="310" font-size="16" fill="#20334b">Somente Smart</text><rect x="755" y="250" width="180" height="100" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="770" y="281" font-size="20" fill="#20334b">Guia lateral</text><text x="770" y="310" font-size="16" fill="#20334b">Manual / proposta</text><rect x="990" y="250" width="165" height="100" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="1005" y="281" font-size="20" fill="#20334b">Destino</text><text x="1005" y="310" font-size="16" fill="#20334b">Acionado</text><path d="M230,300 L285,300" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M465,300 L520,300" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M700,300 L755,300" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M935,300 L990,300" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="85" y="435" font-size="22" fill="#20334b">Lite: tensor → guia manual → destino. Comprimento não é medido por firmware.</text><text x="85" y="485" font-size="22" fill="#20334b">Smart: roda mede deslocamento independente do raio crescente do carretel.</text><text x="85" y="535" font-size="22" fill="#20334b">Escorregamento e deformação da roda são erros de medição a ensaiar.</text><text x="40" y="652" font-size="17" fill="#20334b">No extrusion, heater or molten polymer. Transfer existing filament only.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>