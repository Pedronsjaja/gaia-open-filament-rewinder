<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>08 · Lite elétrico funcional sem MCU</title><desc>Functional blocks only. No KiCad netlist, PCB, safety-rated schematic or verified connector pinout.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">08 · Lite elétrico funcional sem MCU</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><rect x="45" y="180" width="215" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="60" y="211" font-size="20" fill="#20334b">Fonte DC externa</text><text x="60" y="240" font-size="16" fill="#20334b">12 V nominal; rating TBD</text><rect x="340" y="180" width="230" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="355" y="211" font-size="20" fill="#20334b">Fusível + isolamento</text><text x="355" y="240" font-size="16" fill="#20334b">Coordenação a projetar</text><rect x="665" y="180" width="220" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="680" y="211" font-size="20" fill="#20334b">Driver DC</text><text x="680" y="240" font-size="16" fill="#20334b">G2 18v17 candidato</text><rect x="965" y="180" width="190" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="980" y="211" font-size="20" fill="#20334b">Motor DC</text><text x="980" y="240" font-size="16" fill="#20334b">12 V candidato</text><path d="M260,225 L340,225" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M570,225 L665,225" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M885,225 L965,225" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="400" width="260" height="105" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="75" y="431" font-size="20" fill="#20334b">Start / Stop + rearme</text><text x="75" y="460" font-size="16" fill="#20334b">Circuito físico independente</text><rect x="415" y="400" width="280" height="105" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="430" y="431" font-size="20" fill="#20334b">PWM + potenciômetro</text><text x="430" y="460" font-size="16" fill="#20334b">Oscilador sem microcontrolador</text><path d="M320,450 L415,450" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M695,450 L775,285" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="735" y="475" font-size="20" fill="#20334b">E-stop físico corta</text><text x="735" y="510" font-size="20" fill="#20334b">energia dos atuadores.</text><text x="70" y="570" font-size="21" fill="#20334b">0 V comum e desacoplamento não desenhados. Não usar como diagrama de ligação.</text><text x="40" y="652" font-size="17" fill="#20334b">Functional blocks only. No KiCad netlist, PCB, safety-rated schematic or verified connector pinout.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>