<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>10 · ESP32 e navegador</title><desc>Control authority remains local; physical energy isolation must remain effective if browser or ESP32 fails.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">10 · ESP32 e navegador</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><rect x="70" y="230" width="285" height="140" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="85" y="261" font-size="20" fill="#20334b">Navegador</text><text x="85" y="290" font-size="16" fill="#20334b">Comandos / visualização</text><rect x="455" y="230" width="285" height="140" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="470" y="261" font-size="20" fill="#20334b">ESP32</text><text x="470" y="290" font-size="16" fill="#20334b">Máquina de estados local</text><rect x="840" y="230" width="285" height="140" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="855" y="261" font-size="20" fill="#20334b">Atuadores</text><text x="855" y="290" font-size="16" fill="#20334b">Permissivo físico separado</text><path d="M355,265 L455,265" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="365" y="253" font-size="16" fill="#20334b">Pedido</text><path d="M455,340 L355,340" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="365" y="328" font-size="16" fill="#20334b">Telemetria</text><path d="M740,300 L840,300" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="750" y="288" font-size="16" fill="#20334b">Requisição</text><text x="90" y="460" font-size="22" fill="#20334b">Demonstrador offline: SIMULATED. Não envia PWM real nem comprova conexão.</text><text x="90" y="510" font-size="22" fill="#20334b">Integração real exige protocolo, watchdog e validação documentados.</text><text x="90" y="560" font-size="24" fill="#20334b">O navegador não é uma parada de emergência.</text><text x="40" y="652" font-size="17" fill="#20334b">Control authority remains local; physical energy isolation must remain effective if browser or ESP32 fails.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>