<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>03 · Explodida funcional de um eixo</title><desc>Exploded sequence explains function only; tolerances, fasteners and retention details are unresolved.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">03 · Explodida funcional de um eixo</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><path d="M130,330 L1080,330" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="235" width="140" height="75" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="85" y="266" font-size="20" fill="#20334b">Colar</text><text x="85" y="295" font-size="16" fill="#20334b">Retenção axial</text><rect x="235" y="235" width="145" height="75" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="250" y="266" font-size="20" fill="#20334b">Mancal</text><text x="250" y="295" font-size="16" fill="#20334b">Rolamento</text><rect x="410" y="235" width="140" height="75" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="425" y="266" font-size="20" fill="#20334b">Cone</text><text x="425" y="295" font-size="16" fill="#20334b">Centragem</text><rect x="580" y="200" width="170" height="140" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="595" y="231" font-size="20" fill="#20334b">Carretel</text><text x="595" y="260" font-size="16" fill="#20334b">Núcleo / flange</text><rect x="785" y="235" width="140" height="75" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="800" y="266" font-size="20" fill="#20334b">Cone</text><text x="800" y="295" font-size="16" fill="#20334b">Centragem</text><rect x="955" y="235" width="170" height="75" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="970" y="266" font-size="20" fill="#20334b">Mancal + colar</text><text x="970" y="295" font-size="16" fill="#20334b">Retenção axial</text><text x="95" y="430" font-size="22" fill="#20334b">Eixo Ø8 mm e cones 36–60 mm: hipóteses ajustáveis no OpenSCAD</text><text x="95" y="480" font-size="20" fill="#20334b">Torque precisa de cubo anti-rotação; atrito dos cones ainda não validado.</text><text x="95" y="525" font-size="20" fill="#20334b">Acoplamento não deve impor esforço radial ao motor.</text><text x="40" y="652" font-size="17" fill="#20334b">Exploded sequence explains function only; tolerances, fasteners and retention details are unresolved.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>