<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>09 · Smart elétrico funcional</title><desc>Proposal only: final board, pins, currents, logic levels, wiring and fault diagnostics need verification.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">09 · Smart elétrico funcional</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><rect x="55" y="155" width="250" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="70" y="186" font-size="20" fill="#20334b">Fonte / fusível</text><text x="70" y="215" font-size="16" fill="#20334b">Isolamento dos atuadores</text><rect x="455" y="155" width="260" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="470" y="186" font-size="20" fill="#20334b">Driver DC limitado</text><text x="470" y="215" font-size="16" fill="#20334b">Motor do carretel</text><rect x="865" y="155" width="260" height="90" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="880" y="186" font-size="20" fill="#20334b">Driver STEP/DIR</text><text x="880" y="215" font-size="16" fill="#20334b">Motor do guia</text><path d="M305,200 L455,200" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><path d="M360,200 V130 H990 V155" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="560" y="125" font-size="16" fill="#20334b">Barramento DC comum</text><rect x="430" y="340" width="290" height="125" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="445" y="371" font-size="20" fill="#20334b">ESP32 proposto</text><text x="445" y="400" font-size="16" fill="#20334b">Boot inibido; rearme local</text><path d="M510,340 L510,255" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="470" y="285.5" font-size="16" fill="#20334b">PWM / DIR</text><path d="M660,340 L950,255" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="765" y="285.5" font-size="16" fill="#20334b">STEP / DIR</text><rect x="50" y="360" width="285" height="105" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="65" y="391" font-size="20" fill="#20334b">Encoder + condicionamento</text><text x="65" y="420" font-size="16" fill="#20334b">Somente sinais 3,3 V</text><path d="M335,410 L420,410" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="337.5" y="398" font-size="16" fill="#20334b">A / B</text><rect x="840" y="370" width="300" height="105" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="855" y="401" font-size="20" fill="#20334b">Limites NC / falhas</text><text x="855" y="430" font-size="16" fill="#20334b">Dois extremos; stop local</text><path d="M840,425 L730,425" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="75" y="550" font-size="22" fill="#20334b">DC-DC para lógica, retorno comum, pulls e proteção de transientes a detalhar.</text><text x="75" y="595" font-size="23" fill="#20334b">Parada física independente do ESP32, Wi-Fi e navegador.</text><text x="40" y="652" font-size="17" fill="#20334b">Proposal only: final board, pins, currents, logic levels, wiring and fault diagnostics need verification.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>