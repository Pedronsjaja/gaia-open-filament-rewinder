<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>05 · Roda medidora e encoder independente</title><desc>Motor shaft counts and spool turns do not replace the independent linear measuring wheel.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#d27925" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="#f8fafb"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="30" fill="#20334b">05 · Roda medidora e encoder independente</text><text x="40" y="85" font-size="16" fill="#a24b13">PROPOSTA CONCEITUAL / NOT FABRICATION READY</text><path d="M40,105 H1160" stroke="#b8c9d4"/><circle cx="430" cy="353" r="105" fill="#bdd5df" stroke="#42627e" stroke-width="3"/><circle cx="430" cy="353" r="24" fill="#f8fafb" stroke="#42627e" stroke-width="3"/><circle cx="430" cy="213" r="35" fill="#f0c779" stroke="#42627e" stroke-width="3"/><path d="M90,248 H790" stroke="#cf7a2b" stroke-width="6"/><rect x="650" y="330" width="350" height="110" rx="12" fill="#e8f0f5" stroke="#42627e" stroke-width="2"/><text x="665" y="361" font-size="20" fill="#20334b">Encoder no eixo da roda</text><text x="665" y="390" font-size="16" fill="#20334b">SKU / CPR / tensão UNKNOWN</text><path d="M540,353 L650,353" fill="none" stroke="#d27925" stroke-width="4" marker-end="url(#arrow)"/><text x="105" y="145" font-size="23" fill="#20334b">Contrapressor ajustável · carga NOT_MEASURED</text><text x="105" y="530" font-size="24" fill="#20334b">L = contagens × π × diâmetro efetivo / contagens por volta</text><text x="105" y="575" font-size="20" fill="#20334b">Calibrar com comprimento de referência; definir a convenção x1/x2/x4.</text><text x="40" y="652" font-size="17" fill="#20334b">Motor shaft counts and spool turns do not replace the independent linear measuring wheel.</text><text x="40" y="688" font-size="16" fill="#596878">ASSUMED geometry. Physical fit, electrical integration and safety: NOT_VERIFIED.</text></g></svg>